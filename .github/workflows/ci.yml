name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # Integration suite (Phase 1+): unit tests run against the fake, but the
  # //go:build integration tests exercise a real daemon. GitHub-hosted Ubuntu
  # runners ship Docker, so this will run here once those tests exist. Fixtures
  # are `alpine sleep 300` containers in a gantry-test-* namespace, torn down
  # by a step that removes anything matching that prefix.
  #
  # integration:
  #   name: Integration (real daemon)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version: "1.26"
  #         cache: true
  #     - run: go test -tags integration ./...
